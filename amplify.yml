version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm install -g pnpm@9.0.0 && pnpm install --frozen-lockfile
        build:
          commands:
            - cd ../.. && pnpm --filter web... run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - ../../apps/**/node_modules/**/*
          - ../../packages/**/node_modules/**/*
  - appRoot: frontend/apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm install -g pnpm@9.0.0 && pnpm install --frozen-lockfile
        build:
          commands:
            - cd ../.. && pnpm --filter admin... run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - ../../apps/**/node_modules/**/*
          - ../../packages/**/node_modules/**/*
