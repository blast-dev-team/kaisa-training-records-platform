services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: kaisa
      POSTGRES_USER: kaisa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaisa"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://kaisa:${DB_PASSWORD}@db:5432/kaisa
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
